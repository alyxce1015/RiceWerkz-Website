<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Jesse's 23 TypeR</title>
        <link rel="stylesheet" href="../../assets/css/vehicle_info.css">
        <link rel="icon" type="image/png" href="../../assets/images/RW_favicon.png">

        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>
    <!-- 
        Mason's page
        - Make gallery images clickable to enlarge and slideable
        - Add more images to gallery
        - make gallery section a carousel (goal is to have more than a dozen images)
    
    
    
    -->
    <body>
        <header class="site-header">
            <div class="container">
                <h1 class="brand">Jesse</h1>
                <nav class="nav">
                    <!-- Work on pages -->
                    <a href="../../index.html">Home</a>
                    <a href="../../pages/header_pages/parts.html">All Parts</a>
                    <a href="../../pages/header_pages/Gallery.html">Gallery</a>


                </nav>
            </div>
        </header>

        <main>
            <section id="vehicle" class="vehicle">
                <div class="container vehicle-inner">
                    <div class="vehicle-image" aria-hidden="true">
                        <!-- Replace with your image: assets/car.jpg -->
                        <img src="../../assets/images/12_wrx_cover_photo.jpg" alt="Car photo" onerror="this.style.opacity=0.02">
                    </div>
                    <div class="vehicle-info">
                        <h2>2012 Subaru WRX</h2>

                        <div class="social-links">
                            <a class="social-link" target="_blank" href="https://www.instagram.com/r1cewrx/">
                                <i class="fa-brands fa-instagram" id="insta" aria-hidden="true"></i>
                                <span class="sr-only">Instagram</span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <section id="specs" class="container specs">
                <h3 class="section-title">Specs</h3>
                <div class="spec-grid">
                    <div class="spec">
                        <h4>Engine</h4>
                        <p>2.0L EJ257</p>
                    </div>
                    <div class="spec">
                        <h4>Power</h4>
                        <p>400 HP</p>
                    </div>
                    <div class="spec">
                        <h4>Torque</h4>
                        <p>346 LB/FT</p>
                    </div>
                    <div class="spec">
                        <h4>Weight</h4>
                        <p>~3300LBs</p>
                    </div>
                </div>
            </section>

            <section id="gallery" class="container gallery">
                <h3 class="section-title">Gallery</h3>
                <div class="responsive">
                    <div class="img">
                        <img src="../../assets/images/12_wrx_gal_photo1.jpg" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/12_wrx_gal_photo2.jpg" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/12_wrx_cover_photo.jpg" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/WRX_roller.PNG" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/WRX_Cinematic.PNG" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/fillerPhoto.png" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/fillerPhoto.png" alt="Car angle 2" onerror="this.style.opacity=0.02">
                        <img src="../../assets/images/fillerPhoto.png" alt="Car angle 2" onerror="this.style.opacity=0.02">
                    </div>
                </div>


                <div id="myModal" class="modal">
                    <span class="close"></span>
                    <img class="modal-content" id="img01">
                </div>
                
            </section>

            <section id="mods" class="container mods">
                <h3 class="section-title">Mods List</h3>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Performance
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>COBB Accessport V3</li>
                        <li>COBB AOS</li>
                        <li>COBB Fuel Pressure Regulator</li>
                        <li>COBB Turbo Inlet</li>
                        </ul>
                    </div>
                    </label>

                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Exhaust
                        <span class="togglebox__chev">▾</span>
                    </div>
                    <div class="togglebox__content">
                        <ul>
                        <li>COBB Catless downpipe</li>
                        <li>EWG upipe</li>
                        <li>Tial 44m EWG (14psi springs)</li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Suspension
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>Godspeed MonoMax Coilovers</li>
                        <li>Godspeed Lower Control Arms</li>
                        <li>WhiteLine 44mm swaybar</li>
                        <li>WhiteLine swaybar endlinks</li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Wheel Setup
                        <span class="togglebox__chev">▾</span>
                    </div>
                    <div class="togglebox__content">
                        <ul>
                        <li>SSR 5 spoke wheels 18x9.5 +38</li>
                        <li>245/40/18 FullWay</li>
                        <li></li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Lighting
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>Clear Oem Tail Lights</li>
                        <li></li>
                        <li></li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Cooling
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>FP Green Turbo</li>
                        <li>COBB 4" FMIC</li>
                        <li>CSF Radiator</li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Interior
                        <span class="togglebox__chev">▾</span>
                    </div>
                    <div class="togglebox__content">
                        <ul>
                        <li>Cobb shiftknob</li>
                        <li></li>
                        <li></li>
                        </ul>
                    </div>
                    </label>

                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Exterior
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>WRX HatchBack wing</li>
                        <li>Amazon 3-piece Lip</li>
                        <li></li>
                        </ul>
                    </div>
                    </label>
                    <label class="togglebox">
                    <input class="togglebox__input" type="checkbox" />
                    <div class="togglebox__header">
                        Maintenance
                        <span class="togglebox__chev">▾</span>
                    </div>

                    <div class="togglebox__content">
                        <ul>
                        <li>Motul 10w40 oil</li>
                        <li>Mobil 1 OEM filter</li>
                        <li></li>
                        </ul>
                    </div>
                    </label>                    
            </section>

        <footer class="site-footer">
            <div class="container">© 2025 RiceWerkz — Built to be Driven</div>
        </footer>
        <script src="../../assets/scripts/vehicle-info.js"></script>
    </body>
</html>
